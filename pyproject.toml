[project]
name = "secemail"
version = "0.3.0"
description = "Auditor SPF/DKIM/DMARC/ARC + simulación SMTP controlada para Red Team autorizado"
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.6",
    "dkimpy[ARC,ed25519]>=1.1.8",
    "pyspf>=2.0.14",
    "publicsuffix2>=2.20191221",
    "cryptography>=42",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
quishing = ["qrcode[pil]>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
secemail = "secemail.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["secemail*"]
